<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title>TechFest 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<!-- Event Header -->
    <div class="container-fluid bg-dark text-white text-center p-5">
        <h1>TechFest 2026</h1>
        <p>Annual Technical Festival</p>
        <p>Explore Technology and Innovation</p>
        <a href="#events" class="btn btn-warning"> Explore Events </a>
    </div>
        <div class="container mt-4" id="events">
            <h2 class="text-center">Our Events</h2>
                <div class="row">
                <div class="col-md-4">
                <div class="card mb-3">
                <div class="card-body">
                    <h5>Web Design Competition</h5>
                    <p>Design an attractive website.</p>
                </div>
                </div>
                </div>
            <div class="col-md-4">
            <div class="card mb-3">
            <div class="card-body">
                <h5>Coding Competition</h5>
                <p>Show your programming skills.</p>
            </div>
            </div>
            </div>
            <div class="col-md-4">
            <div class="card mb-3">
            <div class="card-body">
                <h5>Project Exhibition</h5>
                <p>Showcase innovative projects.</p>
            </div>
            </div>
            </div>
        </div>
    </div>
    <footer class="bg-dark text-white text-center p-3 mt-4">
        <p>TechFest 2026 - MIT Polytechnic</p>
    </footer>
</body>
</html>
